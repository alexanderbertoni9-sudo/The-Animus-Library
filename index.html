<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap"
    rel="stylesheet"
  />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0905;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'IM Fell English', serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Every overlay starts hidden and fades in once the GLB has loaded. */
    .ui {
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    .ui.visible { opacity: 1; }

    /* ── Side switch arrow ─────────────────────────────────────────────── */
    #side-arrow {
      position: fixed;
      top: 50%;
      right: 22px;
      transform: translateY(-50%);
      z-index: 50;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    #side-arrow .arrow-btn {
      width: 44px;
      height: 44px;
      border: 1.5px solid rgba(212, 168, 83, 0.5);
      border-radius: 50%;
      background: rgba(13, 9, 5, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
    }
    #side-arrow:hover .arrow-btn {
      background: rgba(212, 168, 83, 0.16);
      border-color: rgba(212, 168, 83, 0.85);
      transform: scale(1.07);
    }
    #side-arrow .arrow-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #d4a853;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #side-arrow .arrow-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(212, 168, 83, 0.6);
    }

    /* ── Side label (top centre) ───────────────────────────────────────── */
    #side-label {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #d4a853;
    }

    /* ── Scroll indicator (bottom centre) ──────────────────────────────── */
    #scroll-hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #scroll-hint .hint-track {
      position: relative;
      width: 1px;
      height: 38px;
      background: rgba(212, 168, 83, 0.25);
    }
    #scroll-hint .hint-dot {
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #d4a853;
      transform: translateX(-50%);
      animation: hint-fall 2s ease-in-out infinite;
    }
    @keyframes hint-fall {
      0% { top: 0; opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { top: 35px; opacity: 0; }
    }
    #scroll-hint .hint-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(212, 168, 83, 0.6);
    }

    /* ── Scroll progress bar (right edge) ──────────────────────────────── */
    #scroll-progress {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 100px;
      background: rgba(212, 168, 83, 0.12);
      z-index: 49;
    }
    #scroll-progress-fill {
      width: 100%;
      height: 0%;
      background: rgba(212, 168, 83, 0.6);
    }

    /* ── Book panel ────────────────────────────────────────────────────── */
    #book-panel {
      display: none;
      position: fixed;
      top: 50%;
      right: 80px;
      transform: translateY(-50%);
      width: 300px;
      padding: 32px;
      background: rgba(13, 9, 5, 0.94);
      border: 1px solid rgba(212, 168, 83, 0.18);
      border-radius: 3px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #d4a853;
      z-index: 100;
    }
    #book-panel .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 18px;
      color: rgba(212, 168, 83, 0.5);
      cursor: pointer;
      transition: color 0.2s;
    }
    #book-panel .close-btn:hover { color: #d4a853; }
    #panel-title {
      font-size: 21px;
      line-height: 1.3;
      margin-bottom: 10px;
      color: #d4a853;
    }
    #panel-author {
      font-style: italic;
      font-size: 13px;
      color: rgba(212, 168, 83, 0.6);
    }
  </style>
</head>
<body>
  <div id="side-arrow" class="ui">
    <div class="arrow-btn" id="arrow-btn">
      <svg id="arrow-icon" viewBox="0 0 24 24">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </div>
    <span class="arrow-label" id="arrow-label">Other side</span>
  </div>

  <div id="side-label" class="ui">Left</div>

  <div id="scroll-hint" class="ui">
    <div class="hint-track"><div class="hint-dot"></div></div>
    <span class="hint-label">Scroll</span>
  </div>

  <div id="scroll-progress" class="ui"><div id="scroll-progress-fill"></div></div>

  <div id="book-panel">
    <button class="close-btn" id="panel-close" aria-label="Close">&#10005;</button>
    <h2 id="panel-title"></h2>
    <p id="panel-author"></p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
