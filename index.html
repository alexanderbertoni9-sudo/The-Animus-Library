<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap"
    rel="stylesheet"
  />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0905;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'IM Fell English', serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Every overlay starts hidden and fades in once the GLB has loaded. */
    .ui {
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    .ui.visible { opacity: 1; }

    /* ── Side switch arrow ─────────────────────────────────────────────── */
    #side-arrow {
      position: fixed;
      top: 50%;
      right: 22px;
      transform: translateY(-50%);
      z-index: 50;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    #side-arrow .arrow-btn {
      width: 44px;
      height: 44px;
      border: 1.5px solid rgba(212, 168, 83, 0.5);
      border-radius: 50%;
      background: rgba(13, 9, 5, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
    }
    #side-arrow:hover .arrow-btn {
      background: rgba(212, 168, 83, 0.16);
      border-color: rgba(212, 168, 83, 0.85);
      transform: scale(1.07);
    }
    #side-arrow .arrow-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #d4a853;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #side-arrow .arrow-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(212, 168, 83, 0.6);
    }

    /* ── Side label (top centre) ───────────────────────────────────────── */
    #side-label {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #d4a853;
    }

    /* ── Scroll indicator (bottom centre) ──────────────────────────────── */
    #scroll-hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #scroll-hint .hint-track {
      position: relative;
      width: 1px;
      height: 38px;
      background: rgba(212, 168, 83, 0.25);
    }
    #scroll-hint .hint-dot {
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #d4a853;
      transform: translateX(-50%);
      animation: hint-fall 2s ease-in-out infinite;
    }
    @keyframes hint-fall {
      0% { top: 0; opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { top: 35px; opacity: 0; }
    }
    #scroll-hint .hint-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(212, 168, 83, 0.6);
    }

    /* ── Scroll progress bar (right edge) ──────────────────────────────── */
    #scroll-progress {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 100px;
      background: rgba(212, 168, 83, 0.12);
      z-index: 49;
    }
    #scroll-progress-fill {
      width: 100%;
      height: 0%;
      background: rgba(212, 168, 83, 0.6);
    }

    /* The book panel itself is styled inline (see #book-panel markup). */
    #panel-notes::placeholder { color: rgba(201, 162, 39, 0.4); }

    /* ── Add your own book ─────────────────────────────────────────────── */
    #add-book-trigger {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 60;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(201, 162, 39, 0.4);
      background: rgba(8, 4, 1, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #c9a227;
      font-family: 'IM Fell English', serif;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s, transform 0.2s;
    }
    #add-book-trigger:hover {
      border-color: rgba(201, 162, 39, 0.9);
      background: rgba(201, 162, 39, 0.14);
      transform: scale(1.07);
    }

    #add-book-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 110;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }
    #add-book-form {
      width: 320px;
      padding: 40px 32px 32px;
      background: rgba(8, 4, 1, 0.96);
      border-top: 1px solid rgba(201, 162, 39, 0.4);
      border-bottom: 1px solid rgba(201, 162, 39, 0.4);
      color: #e8d5b0;
      font-family: 'IM Fell English', serif;
    }
    #add-book-form .form-eyebrow {
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(201, 162, 39, 0.5);
      margin-bottom: 24px;
    }
    #add-book-form input {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid rgba(201, 162, 39, 0.2);
      color: #e8d5b0;
      font-family: 'IM Fell English', serif;
      font-size: 15px;
      padding: 8px 0;
      margin-bottom: 24px;
      outline: none;
    }
    #add-book-form input::placeholder { color: rgba(201, 162, 39, 0.45); }
    #add-book-form button {
      background: none;
      border: none;
      color: #c9a227;
      font-family: 'IM Fell English', serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="side-arrow" class="ui">
    <div class="arrow-btn" id="arrow-btn">
      <svg id="arrow-icon" viewBox="0 0 24 24">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </div>
    <span class="arrow-label" id="arrow-label">Other side</span>
  </div>

  <div id="side-label" class="ui">Left</div>

  <div id="scroll-hint" class="ui">
    <div class="hint-track"><div class="hint-dot"></div></div>
    <span class="hint-label">Scroll</span>
  </div>

  <div id="scroll-progress" class="ui"><div id="scroll-progress-fill"></div></div>

  <div id="book-panel" style="
    display: none;
    position: fixed;
    top: 50%;
    right: 48px;
    transform: translateY(-50%);
    width: 280px;
    background: rgba(8,4,1,0.96);
    border-top: 1px solid rgba(201,162,39,0.5);
    border-bottom: 1px solid rgba(201,162,39,0.5);
    border-left: none;
    border-right: none;
    padding: 36px 28px 32px;
    color: #E8D5B0;
    font-family: 'IM Fell English', serif;
    z-index: 100;
  ">
    <div style="font-size:10px;letter-spacing:0.25em;color:rgba(201,162,39,0.5);text-transform:uppercase;margin-bottom:16px;">From the collection</div>
    <h2 id="panel-title" style="font-size:22px;line-height:1.35;color:#F0E0C0;margin-bottom:10px;font-weight:normal;"></h2>
    <p id="panel-author" style="font-style:italic;font-size:13px;color:rgba(201,162,39,0.65);margin-bottom:28px;"></p>
    <div style="width:32px;height:1px;background:rgba(201,162,39,0.3);margin-bottom:28px;"></div>
    <textarea id="panel-notes" placeholder="Write your thoughts…" style="
      width: 100%;
      height: 120px;
      background: rgba(255,255,255,0.03);
      border: none;
      border-bottom: 1px solid rgba(201,162,39,0.2);
      color: #C8B08A;
      font-family: 'IM Fell English', serif;
      font-size: 13px;
      line-height: 1.7;
      resize: none;
      outline: none;
      padding: 8px 0;
      margin-bottom: 20px;
    "></textarea>
    <button onclick="closePanel()" style="
      background:none;border:none;
      color:rgba(201,162,39,0.4);
      font-family:'IM Fell English',serif;
      font-size:11px;letter-spacing:0.2em;
      text-transform:uppercase;cursor:pointer;padding:0;
    ">Dismiss</button>
  </div>

  <button id="add-book-trigger" type="button" aria-label="Add your own book">+</button>

  <div id="add-book-overlay">
    <form id="add-book-form">
      <div class="form-eyebrow">Add to the shelf</div>
      <input id="add-book-title" type="text" placeholder="Title" autocomplete="off" required />
      <input id="add-book-author" type="text" placeholder="Author" autocomplete="off" required />
      <button type="submit">Place on shelf</button>
    </form>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
